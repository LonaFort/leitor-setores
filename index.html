<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>LonaFort WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slide-in { animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
      
      /* MELHORIA 3: Animações de Flash de Tela */
      @keyframes flashSuccess { 0% { box-shadow: inset 0 0 0 12px #10b981; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
      @keyframes flashError { 0% { box-shadow: inset 0 0 0 12px #ef4444; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
      .flash-verde { animation: flashSuccess 0.6s ease-out; }
      .flash-vermelho { animation: flashError 0.6s ease-out; }
      
      body { -webkit-tap-highlight-color: transparent; }
      
      /* CSS Cirúrgico para alinhar a câmera perfeitamente */
      #box-leitor { position: relative; display: flex; justify-content: center; align-items: center; min-height: 260px; }
      #reader { width: 100%; height: 100%; border-radius: 0.75rem; overflow: hidden; position: absolute; inset: 0; }
      #reader video, #reader canvas { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute !important; top: 0 !important; left: 0 !important; border-radius: 0.75rem !important;}
      #qr-shaded-region { border-radius: 0.75rem !important; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden font-sans selection:bg-teal-200" id="body-app">
    
    <!-- CABEÇALHO -->
    <header class="bg-white px-4 py-3 shadow-sm z-50 flex items-center justify-between border-b border-slate-100 flex-shrink-0">
      <img src="https://drive.google.com/thumbnail?id=1rBz6z660wObQcNU0E--LmhoKw2redIRX&sz=w800" alt="LonaFort" class="h-8 object-contain">
      <div class="flex items-center gap-2">
        <i id="icone-setor" class="ph-fill text-xl"></i>
        <h1 class="text-lg font-black tracking-wide uppercase" id="titulo-app">...</h1>
      </div>
    </header>

    <!-- NAVEGAÇÃO -->
    <div class="bg-white p-3 shadow-sm z-40 flex-shrink-0">
      <div class="flex bg-slate-100 rounded-xl p-1 gap-1">
        <button id="tab0" onclick="irParaAba(0)" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 bg-transparent flex items-center justify-center gap-2"><i class="ph-bold ph-scan"></i> Câmera</button>
        <button id="tab1" onclick="irParaAba(1)" class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-400 bg-transparent flex items-center justify-center gap-2"><i class="ph-bold ph-list-checks"></i> Fila (<span id="cont-lista">0</span>)</button>
      </div>
    </div>

    <!-- ÁREA PRINCIPAL -->
    <main class="relative flex-1 w-full overflow-hidden">
      
      <!-- ABA 0: CÂMERA -->
      <section id="painel-camera" class="absolute inset-0 w-full h-full overflow-y-auto p-4 transition-transform duration-300 transform translate-x-0 flex flex-col">
        
        <div class="bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-4 flex items-center px-3">
          <i class="ph-bold ph-user text-slate-400 text-lg mr-2"></i>
          <input type="text" id="operador" placeholder="Seu nome para iniciar..." class="w-full py-3 bg-transparent text-slate-700 font-bold placeholder-slate-400 outline-none">
        </div>

        <div id="box-leitor" class="bg-slate-900 rounded-2xl shadow-inner mb-4 overflow-hidden relative border-4 border-slate-800 transition-colors">
          
          <!-- MELHORIA 2: Botão Trocar Lente -->
          <button id="btn-trocar-camera" onclick="trocarLente()" class="absolute top-3 right-3 z-30 bg-black/60 text-white p-3 rounded-full hidden hover:bg-black/80 transition-colors shadow-lg backdrop-blur-sm">
            <i class="ph-bold ph-arrows-left-right text-xl"></i>
          </button>

          <!-- MELHORIA 4: Tela de Repouso -->
          <div id="overlay-pausa" onclick="acordarCamera()" class="absolute inset-0 z-40 bg-slate-900/95 flex flex-col items-center justify-center text-white cursor-pointer hidden backdrop-blur-md">
            <div class="bg-white/10 p-4 rounded-full mb-3 animate-pulse">
              <i class="ph-bold ph-power text-4xl text-white"></i>
            </div>
            <span class="font-black text-lg">Câmera em Repouso</span>
            <span class="text-sm text-slate-400 font-bold mt-1">Toque aqui para reativar</span>
          </div>

          <div id="reader" class="w-full bg-black min-h-[250px] flex items-center justify-center text-slate-500 font-medium text-sm text-center px-4">Aguardando operador...</div>
        </div>

        <div class="flex gap-2 mb-4 flex-shrink-0">
          <input type="text" id="cod-man" inputmode="numeric" placeholder="Digitar Cód..." class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 text-center font-bold text-slate-700 shadow-sm outline-none focus:border-slate-400">
          <button id="btn-man" onclick="enviarManual()" class="px-6 rounded-xl font-black text-white shadow-sm transition-transform active:scale-95 flex items-center justify-center"><i class="ph-bold ph-arrow-right text-xl"></i></button>
        </div>

        <div id="ultimo-bip-container" class="mt-auto flex-shrink-0">
          <div class="text-center text-slate-400 text-sm font-medium py-4 flex flex-col items-center gap-1"><i class="ph-bold ph-barcode text-3xl opacity-50"></i> Posição da última leitura</div>
        </div>
      </section>

      <!-- ABA 1: LISTA / DASHBOARD -->
      <section id="painel-lista" class="absolute inset-0 w-full h-full overflow-y-auto p-4 transition-transform duration-300 transform translate-x-full">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-4">
          <div onclick="toggleGaveta()" class="flex justify-between items-center cursor-pointer">
            <div>
              <p class="text-[10px] uppercase font-bold text-slate-400">Total Processado</p>
              <p class="text-2xl font-black text-slate-800 leading-none mt-1" id="total-val">0</p>
            </div>
            <div class="bg-slate-50 p-2 rounded-lg text-slate-400 hover:text-slate-600 transition-colors"><i class="ph-bold ph-caret-down"></i></div>
          </div>
          
          <div id="stats-drawer" class="hidden mt-4 pt-4 border-t border-slate-100">
            <div class="grid grid-cols-3 gap-2 mb-4">
               <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase">Corte</p><p class="text-lg font-black text-slate-700" id="tot-corte">0</p></div>
               <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase">Embal</p><p class="text-lg font-black text-slate-700" id="tot-emb">0</p></div>
               <div class="bg-slate-50 p-2 rounded-xl text-center border border-slate-100"><p class="text-[10px] font-bold text-slate-400 uppercase">Exped</p><p class="text-lg font-black text-slate-700" id="tot-ent">0</p></div>
            </div>
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-2">Por Modalidade:</p>
            <div id="lista-mods" class="text-sm"></div>
          </div>
        </div>

        <div id="historico-lista" class="flex flex-col gap-3 pb-6">
          <div class="text-center text-slate-400 text-sm font-medium py-10 flex flex-col items-center gap-2"><i class="ph-bold ph-ghost text-4xl opacity-50"></i> Memória vazia</div>
        </div>
      </section>

    </main>

    <script>
      // =========================================================================
      // URL DO GOOGLE APPS SCRIPT
      // =========================================================================
      const URL_API_GOOGLE = "https://script.google.com/macros/s/AKfycbzp4spSLWEJvkdf3GqPZ9prwtzuz_HmrZ70gRbpoGbpB2-P2Sjtc1Nfrb63YWsekCO3ww/exec"; 

      const urlParams = new URLSearchParams(window.location.search);
      const setorApp = (urlParams.get('setor') || 'CORTE').toUpperCase();
      
      const config = {
        'CORTE': { color: 'text-slate-700', bg: 'bg-slate-700', border: 'border-slate-700', icon: 'ph-scissors' },
        'EMBALAGEM': { color: 'text-blue-600', bg: 'bg-blue-600', border: 'border-blue-600', icon: 'ph-package' },
        'ENTREGA': { color: 'text-emerald-600', bg: 'bg-emerald-600', border: 'border-emerald-600', icon: 'ph-truck' }
      };

      const tema = config[setorApp] || config['CORTE'];

      var totaisGerais = {"CORTE":0, "EMBALAGEM":0, "ENTREGA":0}, mods = {}, fila = [], proc = false, scanner = null;
      var abaAtual = 0, codUltimoScan = "", timeUltimoScan = 0;
      
      // Variáveis para as melhorias de hardware
      var listaLentes = [];
      var lenteAtualIndex = 0;
      var timerRepouso = null;
      const TEMPO_REPOUSO_MS = 120000; // 2 minutos
      
      var inputOp = document.getElementById('operador');
      inputOp.value = localStorage.getItem('opLona') || '';
      inputOp.addEventListener('blur', () => { 
        if(inputOp.value.trim() !== '') {
          localStorage.setItem('opLona', inputOp.value); 
          iniciarSistema(); 
        }
      });
      document.getElementById('cod-man').addEventListener("keyup", function(e) { if (e.key === "Enter") enviarManual(); });

      // MELHORIA 3: Disparar Flash na tela Inteira
      function piscarTela(tipo) {
        const bd = document.getElementById('body-app');
        bd.classList.remove('flash-verde', 'flash-vermelho');
        void bd.offsetWidth; // Força reinício da animação
        bd.classList.add(tipo === 'ok' ? 'flash-verde' : 'flash-vermelho');
      }

      window.onload = function() {
        document.getElementById('titulo-app').innerText = setorApp;
        document.getElementById('titulo-app').classList.add(tema.color);
        document.getElementById('icone-setor').classList.add(tema.color, tema.icon);
        document.getElementById('btn-man').classList.add(tema.bg);
        document.getElementById('box-leitor').classList.replace('border-slate-800', tema.border);
        
        atualizarAbaVisual(0);

        // Mapeia todas as câmeras antes de iniciar
        Html5Qrcode.getCameras().then(devices => {
          if (devices && devices.length > 1) {
            // Filtra só as câmeras traseiras (ignora as frontais de selfie)
            listaLentes = devices.filter(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('traseira'));
            if(listaLentes.length === 0) listaLentes = devices; // Fallback
            
            if(listaLentes.length > 1) {
                document.getElementById('btn-trocar-camera').classList.remove('hidden');
            }
          }
        }).catch(err => console.log("Sem permissão para listar lentes múltiplas"));

        if(inputOp.value !== "") iniciarSistema();
        
        // Ativa tracking de interação do usuário para adiar repouso
        document.addEventListener('touchstart', reiniciarTimerRepouso);
        document.addEventListener('mousemove', reiniciarTimerRepouso);
      };

      // MELHORIA 4: Auto-Pausa
      function reiniciarTimerRepouso() {
        if(timerRepouso) clearTimeout(timerRepouso);
        timerRepouso = setTimeout(pausarCamera, TEMPO_REPOUSO_MS);
      }

      function pausarCamera() {
        if (scanner && scanner.isScanning) {
          scanner.stop().then(() => {
            document.getElementById('overlay-pausa').classList.remove('hidden');
            document.getElementById('overlay-pausa').classList.add('flex');
          }).catch(e => console.log(e));
        }
      }

      function acordarCamera() {
        document.getElementById('overlay-pausa').classList.add('hidden');
        document.getElementById('overlay-pausa').classList.remove('flex');
        reiniciarTimerRepouso();
        iniciarCameraFisica();
      }

      // MELHORIA 2: Trocar Lente
      function trocarLente() {
        if(!scanner || listaLentes.length < 2) return;
        
        lenteAtualIndex++;
        if(lenteAtualIndex >= listaLentes.length) lenteAtualIndex = 0;

        if (scanner.isScanning) {
           scanner.stop().then(() => {
              iniciarCameraFisica();
           });
        }
      }

      function iniciarSistema() {
        buscarResumoServidor();
        reiniciarTimerRepouso();
        if(!scanner) setTimeout(iniciarCameraFisica, 500);
      }

      function iniciarCameraFisica() {
        try {
          if (!scanner) { scanner = new Html5Qrcode("reader"); }
          document.getElementById('reader').innerHTML = '<div class="text-slate-400 p-4 absolute inset-0 flex items-center justify-center">Iniciando câmera...</div>';
          
          let camConfig = { fps: 20, qrbox: { width: 250, height: 250 }, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] };
          
          // Se o usuário selecionou uma lente específica no botão, usa ela. Se não, usa o automático traseiro
          let hardwareConfig = (listaLentes.length > 0) ? { deviceId: { exact: listaLentes[lenteAtualIndex].id } } : { facingMode: "environment" };

          scanner.start(
            hardwareConfig, 
            camConfig, 
            function(c) { adicionarAFila(c); }
          ).catch(function(err) { 
            document.getElementById('reader').innerHTML = '<div class="text-red-500 font-bold p-4 absolute inset-0 flex items-center justify-center text-center">Erro ao abrir câmera.<br>Feche o app e tente novamente.</div>';
          });
        } catch(err) {}
      }

      async function buscarResumoServidor() {
        try {
          const req = await fetch(URL_API_GOOGLE, { method: 'POST', body: JSON.stringify({ acao: "buscarResumo", etapa: setorApp }) });
          const res = await req.json();
          totaisGerais = res.totais; mods = res.mods; atualizarGaveta(); 
        } catch (e) {}
      }

      function irParaAba(index) {
        abaAtual = index;
        atualizarAbaVisual(index);
        document.getElementById('painel-camera').style.transform = index === 0 ? "translateX(0)" : "translateX(-100%)";
        document.getElementById('painel-lista').style.transform = index === 0 ? "translateX(100%)" : "translateX(0)";
      }

      function atualizarAbaVisual(index) {
        const btn0 = document.getElementById('tab0');
        const btn1 = document.getElementById('tab1');
        
        btn0.className = index === 0 ? `flex-1 py-2 text-sm font-bold rounded-lg shadow-sm transition-all text-white flex items-center justify-center gap-2 ${tema.bg}` : `flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-500 bg-transparent flex items-center justify-center gap-2`;
        btn1.className = index === 1 ? `flex-1 py-2 text-sm font-bold rounded-lg shadow-sm transition-all text-white flex items-center justify-center gap-2 ${tema.bg}` : `flex-1 py-2 text-sm font-bold rounded-lg transition-all text-slate-500 bg-transparent flex items-center justify-center gap-2`;
      }

      function toggleGaveta() { 
        const d = document.getElementById('stats-drawer'); 
        d.classList.toggle('hidden'); 
      }

      function atualizarGaveta() {
        document.getElementById('total-val').innerText = totaisGerais[setorApp] || 0;
        document.getElementById('tot-corte').innerText = totaisGerais["CORTE"] || 0;
        document.getElementById('tot-emb').innerText = totaisGerais["EMBALAGEM"] || 0;
        document.getElementById('tot-ent').innerText = totaisGerais["ENTREGA"] || 0;
        let h = ""; 
        for(let k in mods) h += `<div class='flex justify-between py-2 border-b border-slate-50 last:border-0'><span class="font-medium text-slate-600">${k}</span><b class="text-slate-800">${mods[k]}</b></div>`;
        document.getElementById('lista-mods').innerHTML = h || "<div class='text-center text-slate-400 py-2'>Nenhum pedido hoje.</div>";
      }

      function enviarManual() { 
        if(inputOp.value === "") { alert("Digite seu nome!"); inputOp.focus(); return; }
        let v = document.getElementById('cod-man').value; 
        if(v) { adicionarAFila(v); document.getElementById('cod-man').value=""; } 
      }

      function adicionarAFila(codigo) {
        if(inputOp.value === "") { alert("Digite seu nome primeiro!"); inputOp.focus(); return; }
        reiniciarTimerRepouso();
        
        let agora = Date.now();
        let codString = String(codigo).trim();

        if(codString === codUltimoScan && (agora - timeUltimoScan) < 4000) return;
        codUltimoScan = codString; timeUltimoScan = agora;
        bip(800, 0.1);

        let idEncontrado = codString;
        let numeros = codString.match(/\d+/g); 
        
        if (numeros && numeros.length > 0) {
            idEncontrado = numeros.reduce((a, b) => a.length > b.length ? a : b);
        }

        let codCurto = idEncontrado.length > 4 ? idEncontrado.slice(-4) : idEncontrado;
        
        let item = { id: Date.now(), c: idEncontrado, s: "GRAVANDO...", lp: "?", ped: codCurto, mod: "...", status: 'load' };
        fila.push(item); 

        renderTelas();
        if(!proc) processar();
      }

      function renderTelas() {
        document.getElementById('cont-lista').innerText = fila.length;
        if(fila.length === 0) return;

        function gerarHtmlCartao(i) {
           let cardStyle = "bg-white border-slate-200 text-slate-800";
           let icon = `<i class="ph-bold ph-spinner animate-spin text-slate-400 text-xl"></i>`;
           let modStyle = "bg-slate-100 text-slate-500";
           
           if(i.status === 'ok') {
             cardStyle = `${tema.bg} border-transparent text-white shadow-md`;
             icon = `<i class="ph-fill ph-check-circle text-white text-2xl"></i>`;
             modStyle = "bg-black/20 text-white";
           } else if(i.status === 'erro') {
             cardStyle = "bg-amber-500 border-transparent text-white shadow-md animate-shake";
             icon = `<i class="ph-fill ph-warning-circle text-white text-2xl"></i>`;
             modStyle = "bg-black/20 text-white";
           } else if(i.status === 'pendente') {
             cardStyle = "bg-yellow-400 border-transparent text-slate-900 shadow-md";
             icon = `<i class="ph-bold ph-wifi-slash text-slate-900 text-2xl"></i>`;
             modStyle = "bg-black/10 text-slate-800";
           }

           return `
           <div id="${i.id}" class="animate-slide-in p-4 rounded-2xl border flex items-center justify-between gap-4 transition-all duration-300 ${cardStyle}">
             <div class="flex-1 overflow-hidden">
               <div class="flex items-center gap-2 mb-1">
                 <h3 class="font-black text-lg truncate">L.${i.lp}</h3>
                 <span class="text-xs font-mono opacity-75">#${i.ped}</span>
               </div>
               <div class="flex items-center gap-2">
                 <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md ${modStyle} truncate max-w-full">${i.mod}</span>
               </div>
               ${i.status !== 'ok' ? `<p class="text-xs font-bold mt-2 opacity-90">${i.s}</p>` : ''}
             </div>
             <div class="flex-shrink-0">${icon}</div>
           </div>`;
        }

        document.getElementById('ultimo-bip-container').innerHTML = gerarHtmlCartao(fila[fila.length-1]);
        let h = ""; [...fila].reverse().forEach(i => { h += gerarHtmlCartao(i); });
        document.getElementById('historico-lista').innerHTML = h;
      }

      // MELHORIA 1: Fila Inteligente (Offline/Retentativa)
      async function processar() {
        // Tenta achar os que acabaram de entrar ('load') ou que caíram a internet antes ('pendente')
        let i = fila.find(x => x.status === 'load' || x.status === 'pendente');
        if(!i) { proc = false; return; }
        proc = true;
        
        try {
          const req = await fetch(URL_API_GOOGLE, { method: 'POST', body: JSON.stringify({ acao: "processarLogistica", codigo: i.c, operador: inputOp.value, etapa: setorApp }) });
          const r = await req.json();
          let idx = fila.findIndex(x => x.id === i.id);
          
          if(r.sucesso) {
            bip(1500, 0.2); 
            piscarTela('ok');
            fila[idx].status = 'ok'; fila[idx].s = "OK"; fila[idx].lp = r.lped; fila[idx].ped = r.cod; fila[idx].mod = r.mod;
            totaisGerais[setorApp]++;
            let nomeMod = r.mod.replace(" (Pronto)", ""); 
            mods[nomeMod] = (mods[nomeMod] || 0) + 1; 
            atualizarGaveta();
          } else { 
            bip(200, 0.4); 
            piscarTela('erro');
            fila[idx].status = 'erro'; fila[idx].s = r.erro; 
          }
        } catch (err) {
          // INTERNET CAIU OU DEU TIMEOUT
          let idx = fila.findIndex(x => x.id === i.id);
          fila[idx].status = 'pendente'; 
          fila[idx].s = "⏳ Sem internet. Retentando...";
          renderTelas();
          
          // Agenda uma nova tentativa fantasma daqui a 5 segundos
          setTimeout(() => { processar(); }, 5000);
          return; // Para o fluxo principal aqui, deixa o setTimeout cuidar
        }

        renderTelas(); 
        processar();
      }

      function bip(f, d) {
        try {
            if (navigator.vibrate) navigator.vibrate(50);
            var actx = window.AudioContext || window.webkitAudioContext;
            if (actx) {
                var c = new actx(); var o = c.createOscillator(); var g = c.createGain();
                o.connect(g); g.connect(c.destination); 
                o.frequency.value = f; g.gain.value = 0.1;
                o.start(); o.stop(c.currentTime + d);
            }
        } catch(e) {}
      }
    </script>
  </body>
</html>
